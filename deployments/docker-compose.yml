services:
  gateway:
    build:
      context: ..          # 设置上下文为项目根目录
      dockerfile: flexgate/docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../flexgate/configs:/app/configs # 挂载配置，方便修改不用重编镜像
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - flex-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/users/1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile # 建议给 service 也写个 Dockerfile
    ports:
      - "9001:9001"
    networks:
      - flex-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9001/users"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    ports:
      - "9002:9002"
    networks:
      - flex-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9002/orders"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  flex-net:
    driver: bridge